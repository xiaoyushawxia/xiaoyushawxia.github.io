name: Update Homepage Statistics

on:

  workflow_dispatch:

  schedule:

    - cron: '0 0 * * *'

jobs:

  update:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

        with:

          node-version: 22

      - run: npm install

        working-directory: scripts

      # City coordinates for the map (GeoNames, CC BY 4.0). If the download
      # fails the map still works, with every visit at its country's centre.
      - run: |

          curl -fsSL -o cities1000.zip https://download.geonames.org/export/dump/cities1000.zip && unzip -o -q cities1000.zip || echo "GeoNames download failed"

        working-directory: scripts

      - run: node update_stats.mjs

        working-directory: scripts

        env:

          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}

          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}

          # Optional: mainland China from Baidu Tongji (see README).
          BAIDU_API_KEY: ${{ secrets.BAIDU_API_KEY }}

          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}

          BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}

          BAIDU_SITE_ID: ${{ secrets.BAIDU_SITE_ID }}

      # Baidu rotates its refresh token on every use; store the new one so
      # tomorrow's run can log in again. Needs a GH_PAT secret that may write
      # this repository's Actions secrets.
      - if: ${{ always() && hashFiles('scripts/baidu_refresh_token.txt') != '' }}

        run: |

          gh secret set BAIDU_REFRESH_TOKEN < baidu_refresh_token.txt
          rm -f baidu_refresh_token.txt

        working-directory: scripts

        env:

          GH_TOKEN: ${{ secrets.GH_PAT }}

      - run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add stats.json

          git commit -m "Update statistics" || exit 0

          git push